# Builds gg's downloads for a version tag (v0.3.0, matching Cargo.toml's version) and puts
# them, each with its sha256, on a DRAFT GitHub release: the macOS universal disk image,
# the Linux AppImage and .deb, the Windows installer. Publishing the draft is done by hand.
#
# gg updates itself from these releases: each build job also signs its platform's update
# (the macOS universal .app.tar.gz made from the final signed app, the AppImage, the Windows
# installer) with the release key, in a step of its own that alone sees the secrets
# TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD (without them the release
# fails there); the updates job checks every signature against the public key in the app's
# config, writes the updater's manifest, latest.json, and checks that it names this version
# and only this tag's assets that the release uploads. The app checks
# releases/latest/download/latest.json, so a release reaches it once the draft is published.
#
# Code signing is macOS's ad hoc signature only; no secrets other than the signing key and
# the run's token, which may write only in the job that makes the release. No build cache:
# a release is built from the tag alone.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # What the draft release uploads, each a file of dist-release/: the updates job checks
  # latest.json against this list, and the release job uploads exactly it.
  ASSETS: >-
    gg-macos-universal.dmg gg-macos-universal.dmg.sha256
    gg-macos-universal.app.tar.gz gg-macos-universal.app.tar.gz.sha256 gg-macos-universal.app.tar.gz.sig
    gg-linux-x86_64.AppImage gg-linux-x86_64.AppImage.sha256 gg-linux-x86_64.AppImage.sig
    gg-linux-amd64.deb gg-linux-amd64.deb.sha256
    gg-windows-x64-setup.exe gg-windows-x64-setup.exe.sha256 gg-windows-x64-setup.exe.sig
    latest.json
    SHA256SUMS

defaults:
  run:
    shell: bash

jobs:
  version:
    name: The tag matches the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reads the CI runs of the tagged commit (below).
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the tag with Cargo.toml
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::Cargo.toml's [workspace.package] has no version."
            exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG does not match the version in Cargo.toml ($version). Tag v$version, or set the version in Cargo.toml (and package.json) first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          # The tests ran for this very commit (CI runs on pull requests and pushes to main),
          # every OS passed: a red or untested commit is not built into a release.
          runs=$(gh run list --repo "$REPO" --workflow ci.yml --commit "$SHA" --limit 20 \
            --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          if [ "${runs:-0}" -lt 1 ]; then
            echo "::error::No passing CI run for $SHA, the commit $TAG points at. Tag a commit CI passed on (open a pull request or push it to main first)."
            exit 1
          fi

  macos:
    name: macOS (universal .dmg)
    needs: version
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release rust-toolchain.toml names, for both Mac architectures.
      - name: Rust
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustup show active-toolchain

      - name: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install the UI's packages
        run: pnpm install --frozen-lockfile

      - name: Build, sign ad hoc, make the disk image and the update
        run: scripts/release-macos.sh

      # The only step that sees the signing key.
      - name: Sign the update
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/sign-update.sh "$VERSION" dist-release/gg-macos-universal.app.tar.gz

      - name: Keep the downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gg-macos
          path: |
            dist-release/gg-macos-universal.dmg
            dist-release/gg-macos-universal.dmg.sha256
            dist-release/gg-macos-universal.app.tar.gz
            dist-release/gg-macos-universal.app.tar.gz.sha256
            dist-release/gg-macos-universal.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux (.AppImage, .deb)
    needs: version
    # The oldest supported runner: the AppImage then runs on systems with an older glibc.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file libssl-dev libxdo-dev libdbus-1-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # The release rust-toolchain.toml names.
      - name: Rust
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install the UI's packages
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm tauri build --bundles deb,appimage

      - name: Name the downloads, with their checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir dist-release
          appimage="target/release/bundle/appimage/gg_${VERSION}_amd64.AppImage"
          deb="target/release/bundle/deb/gg_${VERSION}_amd64.deb"
          for f in "$appimage" "$deb"; do
            [ -f "$f" ] || { echo "::error::$f was not built"; ls -R target/release/bundle; exit 1; }
          done
          cp "$appimage" dist-release/gg-linux-x86_64.AppImage
          cp "$deb" dist-release/gg-linux-amd64.deb
          cd dist-release
          for f in *; do sha256sum "$f" > "$f.sha256"; done
          cat ./*.sha256

      # The only step that sees the signing key. The AppImage is the update (it replaces
      # itself); a .deb install is updated by its package manager.
      - name: Sign the update
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/sign-update.sh "$VERSION" dist-release/gg-linux-x86_64.AppImage

      - name: Keep the downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gg-linux
          path: dist-release/
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows (installer)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release rust-toolchain.toml names.
      - name: Rust
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install the UI's packages
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm tauri build --bundles nsis

      - name: Name the download, with its checksum
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir dist-release
          setup="target/release/bundle/nsis/gg_${VERSION}_x64-setup.exe"
          [ -f "$setup" ] || { echo "::error::$setup was not built"; ls -R target/release/bundle; exit 1; }
          cp "$setup" dist-release/gg-windows-x64-setup.exe
          cd dist-release
          sha256sum gg-windows-x64-setup.exe > gg-windows-x64-setup.exe.sha256
          cat ./*.sha256

      # The only step that sees the signing key. The installer is the update (the app runs
      # it to update itself).
      - name: Sign the update
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/sign-update.sh "$VERSION" dist-release/gg-windows-x64-setup.exe

      - name: Keep the downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gg-windows
          path: dist-release/
          if-no-files-found: error
          retention-days: 7

  updates:
    name: Check the updates, write latest.json
    needs: [version, macos, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release rust-toolchain.toml names, for gg-release (crates/gg-release).
      - name: Rust
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Build gg-release
        run: cargo build --locked --release -p gg-release

      - name: Fetch the downloads
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gg-*
          merge-multiple: true
          path: dist-release

      # With the verifier the app's updater uses, against the key in the app's config: each
      # update is signed by the release key, for this version.
      - name: Check each update's signature with the app's key
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          target/release/gg-release verify --config src-tauri/tauri.conf.json --version "$VERSION" \
            dist-release/gg-macos-universal.app.tar.gz \
            dist-release/gg-linux-x86_64.AppImage \
            dist-release/gg-windows-x64-setup.exe

      - name: Write latest.json
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir updates
          target/release/gg-release manifest --version "$VERSION" --tag "$TAG" \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --notes "gg $VERSION" \
            --dir dist-release --out updates/latest.json
          cat updates/latest.json

      # The manifest names this version, and each URL one of this tag's assets that the
      # release job uploads (ASSETS), whose signature verifies.
      - name: Check latest.json against the release's assets
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # shellcheck disable=SC2086 # ASSETS is a list of file names
          target/release/gg-release check-manifest --config src-tauri/tauri.conf.json \
            --version "$VERSION" --tag "$TAG" --dir dist-release updates/latest.json $ASSETS

      - name: Keep latest.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gg-updates
          path: updates/latest.json
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft release
    needs: [version, macos, linux, windows, updates]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Fetch the downloads
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gg-*
          merge-multiple: true
          path: dist-release

      - name: Check every download against its checksum
        working-directory: dist-release
        run: |
          ls -l
          for sum in *.sha256; do sha256sum -c "$sum"; done
          cat ./*.sha256 > SHA256SUMS

      # Every asset is there, and nothing else is uploaded.
      - name: Create the draft release
        working-directory: dist-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for f in $ASSETS; do
            [ -s "$f" ] || { echo "::error::$f is missing"; exit 1; }
          done
          # shellcheck disable=SC2086 # ASSETS is a list of file names
          gh release create "$TAG" --draft --verify-tag --title "gg $VERSION" --generate-notes $ASSETS
