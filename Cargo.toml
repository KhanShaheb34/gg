[workspace]
resolver = "3"
members = ["crates/gg-core", "crates/gg-devserver", "crates/gg-release", "src-tauri"]

[workspace.package]
version = "0.5.3"
edition = "2024"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"

# Build scripts and proc macros run on the build machine only: not stripped (a stripping
# tool that writes a malformed library, as Homebrew's llvm-objcopy did here, breaks the build).
[profile.release.build-override]
strip = false
