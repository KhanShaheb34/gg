[package]
name = "gg-core"
description = "Git graph core: reads repositories through the git CLI and lays out the commit graph"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Exposes `gg_core::testutil` (temp git repositories) to integration tests and dependent crates.
testutil = ["dep:tempfile"]

[dependencies]
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = { version = "3", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "rt", "rt-multi-thread", "macros", "time", "sync"] }

[dev-dependencies]
# Self dev-dependency: turns on `testutil` for the integration tests in `tests/`.
gg-core = { path = ".", features = ["testutil"] }
tempfile = "3"
# Paused clock for debounce unit tests.
tokio = { version = "1", features = ["test-util"] }
