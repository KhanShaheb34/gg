[package]
name = "gg-devserver"
description = "Dev/test-only HTTP bridge to gg-core for running the UI in a browser"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
axum = "0.8"
gg-core = { path = "../gg-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
# Turns on `gg_core::testutil` (temp git repositories) for the integration tests.
gg-core = { path = "../gg-core", features = ["testutil"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "time"] }
