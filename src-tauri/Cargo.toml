[package]
name = "gitgraph"
description = "GitGraph desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "gitgraph_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
