<!--
  gg's app icon, 1024 x 1024: the mark of the site's favicon (mark.svg) on a dark rounded
  square laid out on the macOS icon grid (an 824 px tile, 100 px around it for the shadow).
  The tile is dark with a faint light edge, so it reads on light and dark Docks alike.
  Rendered to icon.png, from which `pnpm tauri icon` makes every size.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262830"/>
      <stop offset="1" stop-color="#131418"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="url(#edge)" stroke-width="4"/>
  <!-- The favicon's 32-unit mark, scaled to the tile. -->
  <g transform="translate(100 100) scale(25.75)">
    <path d="M11 7v18" stroke="#6b9bff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M21 10.5c0 6-10 4.5-10 11" stroke="#fb8a4e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="11" cy="8" r="3.2" fill="#6b9bff"/>
    <circle cx="21" cy="10.5" r="3.2" fill="#fb8a4e"/>
    <circle cx="11" cy="24" r="3.2" fill="#6b9bff"/>
  </g>
</svg>
